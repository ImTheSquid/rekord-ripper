[package]
name = "rekord-ripper"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Jack Hogan <jackhogan11@gmail.com>"]
description = "Rekordbox analysis utilities"
repository = "https://github.com/ImTheSquid/rekord-ripper"

[dependencies]
anyhow = "1.0.102"
base85 = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29"
flate2 = "1"
owo-colors = { version = "4.3.0", features = ["alloc", "supports-colors"] }
ratatui = "0.30"
rusqlite = { version = "0.40.0", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
rusty-chromaprint = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
# Blocking by design, so no tokio. rustls default rather than native-tls: the
# build already pays for vendored OpenSSL via rusqlite, and native-tls would
# mean debugging schannel on Windows as well.
ureq = { version = "3.4", features = ["cookies", "json"] }
uuid = { version = "1", features = ["v4"] }
